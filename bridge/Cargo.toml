[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
authors = ["D.Krizhanovskyi <dkrizhanovskyi@peopay.io>"]
description = "Cross-chain bridge module for PeoChain."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
bincode = "1.3"
# For demonstration, no external crates beyond std.
# Add any cryptographic libraries (e.g., merkleproof) if needed for real bridging.

[lib]
name = "peo_bridge"
# If you created src/lib.rs, path to it:
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.0"
# Extra dependencies for tests only (optional).
