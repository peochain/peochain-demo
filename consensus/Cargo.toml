[package]
name = "consensus"
version = "0.1.1"
edition = "2021"
authors = ["D.Krizhanovskyi <d.krizhanovskyi@peochain.xyz>"]
description = "PoSyg + DCS consensus module for PeoChain."
license = "MIT"

[dependencies]
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
bincode = "1.3"

[dev-dependencies]
proptest = "1.0"

[lib]
name = "peo_consensus"
path = "src/lib.rs"

[[bin]]
name = "consensus_node"
path = "src/main.rs"